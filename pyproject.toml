[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sade-benchmark"
version = "0.1.0"
description = "Multi-algorithm continuous constrained CEC benchmark framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pymoo>=0.6"]

[tool.setuptools.package-data]
"sade_benchmark.benchmarks" = ["data/*.mat", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
